<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Terminal session showing ccslot add, list and launch">
  <title>ccslot in a terminal</title>
  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; }
      .prompt { fill: #D9603F; }
      .cmd    { fill: #F5F1EA; }
      .dim    { fill: #8A8079; }
      .star   { fill: #D9603F; }
    </style>
  </defs>

  <rect width="880" height="470" rx="14" fill="#12100E"/>
  <rect x="0.5" y="0.5" width="879" height="469" rx="13.5" fill="none" stroke="#3C3733"/>
  <rect x="1" y="1" width="878" height="44" rx="13" fill="#1B1815"/>
  <rect x="1" y="38" width="878" height="7" fill="#1B1815"/>

  <circle cx="26" cy="23" r="6" fill="#D9603F"/>
  <circle cx="48" cy="23" r="6" fill="#C9A227" opacity="0.75"/>
  <circle cx="70" cy="23" r="6" fill="#93A87E" opacity="0.75"/>
  <text class="m dim" x="440" y="28" text-anchor="middle" font-size="13">~/code</text>

  <!-- Columns are placed with explicit x rather than runs of spaces: renderers
       disagree about xml:space, but they all agree about coordinates. -->
  <g class="m">
    <text x="28" y="86" class="prompt">$</text>
    <text x="48" y="86" class="cmd">npx ccslot add work</text>

    <text x="48" y="112" class="dim">created ~/.claude-work</text>
    <text x="68" y="134" class="dim">shared</text>
    <text x="140" y="134" class="dim">projects</text>
    <text x="68" y="156" class="dim">shared</text>
    <text x="140" y="156" class="dim">skills</text>
    <text x="68" y="178" class="dim">shared</text>
    <text x="140" y="178" class="dim">plans</text>
    <text x="68" y="200" class="dim">shared</text>
    <text x="140" y="200" class="dim">settings.json</text>
    <text x="48" y="222" class="dim">alias ccwork added to ~/.zshrc</text>

    <text x="28" y="268" class="prompt">$</text>
    <text x="48" y="268" class="cmd">ccslot list</text>

    <text x="48" y="294" class="star">*</text>
    <text x="68" y="294" class="cmd">work</text>
    <text x="228" y="294" class="cmd">ccwork</text>
    <text x="388" y="294" class="cmd">4 shared</text>

    <text x="68" y="316" class="dim">personal</text>
    <text x="228" y="316" class="dim">ccpersonal</text>
    <text x="388" y="316" class="dim">4 shared</text>

    <text x="28" y="362" class="prompt">$</text>
    <text x="48" y="362" class="cmd">ccslot personal --resume</text>
    <text x="48" y="388" class="dim">resuming a conversation started under the other account…</text>

    <text x="28" y="434" class="prompt">$</text>
    <text x="48" y="434" class="cmd">▌</text>
  </g>
</svg>
