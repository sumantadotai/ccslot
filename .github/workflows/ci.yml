name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The bot's version PR only bumps package.json/CHANGELOG and its runs sit in
    # "action_required" forever; push-to-main CI covers that commit anyway.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm, not pnpm: pnpm 11 refuses to run on Node < 22.13, which would cost us the
      # Node 20 row. ccslot has no runtime deps, so this only installs vitest.
      - run: npm install --no-audit --no-fund
      - run: npm test
