name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # ponytail: zero runtime deps, so no install step — this also lets the matrix
      # cover Node 18/20, which pnpm 11 itself refuses to run on.
      - run: node --test test/*.test.js
