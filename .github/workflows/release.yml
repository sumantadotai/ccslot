name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # changesets crashes instead of printing npm's E403, so check the token first:
      # this prints the account the token belongs to, or fails with the real reason.
      # npm is retiring 2FA-bypassing tokens for direct publishing, so this job relies on
      # Trusted Publishing (OIDC) — which needs npm >= 11.5.1 and `id-token: write` above.
      # NPM_TOKEN stays as a fallback for accounts that still allow token publishing.
      - run: npm install -g npm@latest
      - name: Show npm identity
        run: npm --version && (npm whoami || echo 'no token identity — expecting OIDC')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Opens/updates a "Version Packages" PR. Merging it publishes to npm.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
