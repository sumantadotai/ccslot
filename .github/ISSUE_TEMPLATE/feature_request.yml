name: Feature request
description: Suggest something ccslot should do
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that ccslot makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: A command, a flag, a config key — whatever shape it takes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead right now
